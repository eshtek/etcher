name: Release

# Signed release builds. Unsigned CI builds live in build-windows.yml.
#
# Signing credentials are never stored: the Windows job authenticates to Azure
# Artifact Signing over OIDC via the `release` environment, whose federated
# credential subject is `repo:eshtek/etcher:environment:release`. This repo is
# public, so the signing jobs must stay unreachable from pull_request triggers.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Publish the GitHub release as a draft
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: 20.x
  # Pin the Artifact Signing client. Verify the current version on nuget.org
  # before the first real release; the package kept its Trusted Signing name
  # through the 2026 rename.
  SIGNING_CLIENT_VERSION: '1.0.60'

jobs:
  windows:
    name: Windows x64 (signed)
    # windows-latest resolves to Server 2025, which ships Visual Studio 18.
    # @electron/node-gyp matches VS by a hardcoded list of version years and
    # rejects 18 as unsupported, so mountutils fails to build during npm ci.
    runs-on: windows-2022
    environment: release
    permissions:
      id-token: write # required for the OIDC token exchange with Entra
      contents: read
    steps:
      - name: Enable long paths in git
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      # The sidecar (etcher-util) embeds Node 20 via pkg; native modules
      # must be compiled against the same major version or the sidecar
      # segfaults on startup.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: nuget/setup-nuget@v2

      # signtool and the signing dlib must sit at paths with no spaces in them.
      # signtool ships under "C:\Program Files (x86)\Windows Kits\..." and fails
      # with an unhelpful error if handed to forge from there, so stage a copy.
      - name: Stage signing toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\signing | Out-Null

          nuget install Microsoft.Trusted.Signing.Client `
            -Version $env:SIGNING_CLIENT_VERSION `
            -OutputDirectory C:\signing `
            -ExcludeVersion

          $sdkSigntool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $sdkSigntool) { throw 'signtool.exe not found in the Windows SDK' }

          # Copy the whole directory: signtool depends on sibling DLLs.
          New-Item -ItemType Directory -Force -Path C:\signing\signtool | Out-Null
          Copy-Item "$($sdkSigntool.Directory)\*" C:\signing\signtool\ -Recurse -Force

          @{
            Endpoint               = 'https://wus2.codesigning.azure.net/'
            CodeSigningAccountName = 'eshtek-signing'
            CertificateProfileName = '${{ vars.AZURE_CERT_PROFILE_NAME }}'
            CorrelationId          = ''
          } | ConvertTo-Json | Set-Content -Path C:\signing\metadata.json -Encoding utf8

          Get-Content C:\signing\metadata.json

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64

      - name: Build signed distributables
        run: npm run make
        env:
          NODE_ENV: production # forge.config.ts gates signing on this
          AZURE_CODE_SIGNING_DLIB: C:\signing\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll
          AZURE_METADATA_JSON: C:\signing\metadata.json
          SIGNTOOL_PATH: C:\signing\signtool\signtool.exe

      - name: Verify signatures
        shell: pwsh
        run: |
          # Check the Squirrel installer AND the packaged app. Verifying only
          # out\make covers the installer but not "HexOS Imager.exe", which is
          # the binary users actually run once installed.
          $targets = @()
          $targets += Get-ChildItem -Path out\make -Recurse -Include *.exe -File
          Get-ChildItem -Path out -Directory -Filter '*-win32-*' | ForEach-Object {
            # Squirrel.exe is a build-time helper that electron-forge drops into
            # the staging directory after the packager's signing pass, so it is
            # unsigned here and always will be. It is not shipped from this
            # directory — the copy users get lives inside the nupkg and is
            # signed by MakerSquirrel.
            $targets += Get-ChildItem -Path $_.FullName -Filter '*.exe' -File |
              Where-Object { $_.Name -ne 'Squirrel.exe' }
          }
          if ($targets.Count -lt 2) {
            throw "expected the installer and the packaged app, found $($targets.Count)"
          }
          $failed = @()
          foreach ($f in $targets) {
            Write-Host "=== $($f.FullName) ==="
            & C:\signing\signtool\signtool.exe verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $f.FullName }
          }
          if ($failed.Count -gt 0) {
            throw "signature verification failed for: $($failed -join '; ')"
          }

          # The nupkg is the payload Squirrel actually installs, so verify its
          # contents rather than trusting the staging directory. This is also
          # what covers the Squirrel.exe skipped above.
          $nupkg = Get-ChildItem -Path out\make -Recurse -Filter *.nupkg -File | Select-Object -First 1
          if (-not $nupkg) { throw 'no .nupkg produced' }
          $expanded = Join-Path $env:RUNNER_TEMP 'nupkg'
          Expand-Archive -Path $nupkg.FullName -DestinationPath $expanded -Force

          $shipped = Get-ChildItem -Path $expanded -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.node' }
          Write-Host "verifying $($shipped.Count) binaries inside $($nupkg.Name)"
          $failedShipped = @()
          foreach ($f in $shipped) {
            & C:\signing\signtool\signtool.exe verify /pa /q $f.FullName
            if ($LASTEXITCODE -ne 0) { $failedShipped += $f.FullName.Replace($expanded, '') }
          }
          if ($failedShipped.Count -gt 0) {
            throw "unsigned binaries inside the nupkg: $($failedShipped -join '; ')"
          }
          Write-Host 'every shipped binary is signed'

      # Packaging succeeding does not mean the app starts: the pkg sidecar
      # embeds its own Node and segfaults on startup if native modules were
      # built against a different major version. Launching it is what catches
      # that. The screenshot is for eyeballing a blank/crashed renderer, which
      # a live process alone would not reveal.
      - name: Smoke launch and screenshot
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path out -Directory -Filter '*-win32-*' | Select-Object -First 1
          if (-not $appDir) { throw 'no packaged app directory under out\' }
          $exe = Get-ChildItem -Path $appDir.FullName -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "no executable in $($appDir.FullName)" }

          Write-Host "launching $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($proc.HasExited) {
            throw "app exited during startup with code $($proc.ExitCode)"
          }

          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD\smoke\windows-x64-launch.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'app survived 30s and was screenshotted'

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-x64
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: hexos-imager-windows-x64
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
          if-no-files-found: error
          retention-days: 14

      # Surfaces timestamping warnings that signtool swallows.
      - name: Upload signing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signing-log
          path: electron-windows-sign.log
          if-no-files-found: ignore

  macos:
    name: macOS ${{ matrix.arch }} (signed)
    # Inert until the Apple Developer Program enrollment for Eshtek Inc.
    # completes and the Developer ID cert is in repo secrets. Flip the repo
    # variable APPLE_SIGNING_ENABLED to 'true' to arm these jobs.
    if: vars.APPLE_SIGNING_ENABLED == 'true'
    runs-on: macos-14
    environment: release
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Certs created in Xcode are machine-bound; CI needs the exported .p12
      # from 1Password, base64-encoded into APPLE_DEVELOPER_ID_P12.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # notarytool takes an app-specific password on the command line, where it
      # is visible to anything that can read a process list. An App Store
      # Connect API key is read from a file, so write it out and let
      # forge.config.ts pick the key path over the password path.
      - name: Stage notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build, sign and notarize
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          NODE_ENV: production
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # macos-14 runners are arm64 and have no Rosetta, so only the native
      # slice can actually be launched here.
      - name: Smoke launch and screenshot
        if: matrix.arch == 'arm64'
        run: |
          APP=$(find out -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo 'no .app found under out/'; exit 1; }
          echo "launching $APP"
          open "$APP"
          sleep 30
          pgrep -f 'HexOS Imager' >/dev/null || { echo 'app not running after 30s'; exit 1; }
          mkdir -p smoke
          screencapture -x "smoke/macos-${{ matrix.arch }}-launch.png"
          osascript -e 'quit app "HexOS Imager"' || true
          echo 'app survived 30s and was screenshotted'

      - name: Upload smoke screenshot
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify notarization
        run: |
          APP=$(find out -name 'HexOS Imager.app' -maxdepth 4 | head -1)
          codesign -dv --verbose=2 "$APP"
          spctl -a -vv "$APP"
          find out/make -name '*.dmg' -exec xcrun stapler validate {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: hexos-imager-macos-${{ matrix.arch }}
          path: out/make/**/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keychain and notarization key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary/AuthKey.p8" || true
